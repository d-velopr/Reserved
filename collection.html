  <!-- Light mode lasts for this tab only (sessionStorage); every visit opens dark.
       Set before the page draws, so changing pages never flashes dark. The
       switch itself is in site.js. -->
  <script>(function(){var d;try{d=sessionStorage.getItem("reservedTheme")==="dark"}catch(e){}if(!d)document.documentElement.setAttribute("data-theme","light")})()</script>

  <!-- The 21+ entry gate lives on the Home page. A visitor who hasn't passed it
       yet goes there first (index.html?next=this page) and comes back after.
       Runs before anything draws, so the page never flashes. -->
  <script>
    (function () {
      var ok;
      try {
        ok = ["reserved21", "reservedAnalytics", "reservedJoined"].every(function (k) {
          return localStorage.getItem(k) === "yes";
        });
      } catch (e) {
        ok = true; // storage blocked: the gate can't be remembered, so don't loop
      }
      if (!ok) location.replace("index.html?next=" + encodeURIComponent(
        location.pathname.split("/").pop() + location.search + location.hash));
    })();
  </script>

  <!-- Google tag (gtag.js), G-2X555LCLRX. Analytics stays off until the visitor
       clicks "Yes, enter" on the 21+ gate (Home page), which also agrees to analytics.
       site.js turns it on and loads the tag after that click (or right away for
       a visitor who already agreed). Ads storage is never turned on. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    gtag('js', new Date());
  </script>
