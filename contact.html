  <meta name="theme-color" content="#0B0B0C" />
  <!-- Light mode lasts for this tab only (sessionStorage); every visit opens dark.
       Set before the page draws, so changing pages never flashes dark. The
       switch itself is in site.js. -->
  <script>try{if(sessionStorage.getItem("reservedTheme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>

  <!-- Google tag (gtag.js), G-2X555LCLRX. Analytics stays off until the visitor
       clicks "Yes, enter" on the 21+ gate (Home page), which also agrees to analytics.
       site.js turns it on and loads the tag after that click (or right away for
       a visitor who already agreed). Ads storage is never turned on. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    gtag('js', new Date());
  </script>

      <button class="nav-theme" type="button" role="switch" aria-checked="true" aria-label="Dark mode"><span class="theme-switch" aria-hidden="true"><span class="theme-knob"><svg class="ts-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><svg class="ts-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></span></span></button>
    </nav>
    <button class="theme-btn" type="button" aria-label="Switch to light mode"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M5.3 18.7l1.55-1.55M17.15 6.85l1.55-1.55" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a7 7 0 0 0 10.7 10.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <a class="ig-btn" href="https://www.instagram.com/reservedwayornoway/" target="_blank" rel="noopener" aria-label="Reserved on Instagram (@reservedwayornoway)">

  <main>
    <section class="page-head">
      <div class="wrap">
        <h1>Contact Us</h1>
      </div>
    </section>

    <!-- Messages go to the Messages tab of the sign-up Sheet (see subscribe.gs). -->
    <div class="prose">
      <form id="contact-form" class="contact-form stitched" novalidate>
        <label for="c-name">Name</label>
        <input id="c-name" name="name" type="text" autocomplete="name" placeholder="Your name" maxlength="100" required />
        <label for="c-email">Email</label>
        <input id="c-email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" maxlength="200" required />
        <label for="c-license">License # <span class="opt">(optional)</span></label>
        <input id="c-license" name="license" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. C10-0000000-LIC" maxlength="40" />
        <label for="c-msg">Message</label>
        <textarea id="c-msg" name="message" rows="6" maxlength="2000" placeholder="How can we help?" required></textarea>
        <!-- Honeypot: real people never see or fill this. -->
        <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button class="btn btn-red" type="submit">Send Message</button>
        <p class="form-msg" id="contact-msg" role="status" aria-live="polite"></p>
        <p class="form-note">We only use what you send here to reply. It doesn't add you to our email list. <a href="privacy.html">Privacy Policy</a></p>
      </form>
    </div>

  </main>

  <footer class="foot">

        @reservedwayornoway
